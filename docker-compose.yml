services:
  postgres-db:
    image: postgres:16-alpine
    container_name: hablandocontigo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mi_base_datos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1012332747Js}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mi_base_datos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: hablandocontigo_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: hablandocontigo_backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.220.77:8085}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://192.168.220.77:8085,http://localhost:8085,http://localhost:5173}
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-1012332747Js}
      DB_NAME: ${POSTGRES_DB:-mi_base_datos}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      JWT_SECRET: ${JWT_SECRET:-hablandocontigo_super_secret_jwt_key_2026_enterprise_998877}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "3001:3000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: hablandocontigo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  pgdata:
    name: pgdata
  ollama_data:
    name: ollama_data
